<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,minimum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>MASALU 排班月曆</title>
<style>
:root{
  --bg:#f6f7fb;--card:#fff;--text:#202124;--muted:#8a8f98;--line:#e8eaf0;
  --shadow:0 10px 26px rgba(17,24,39,.08)
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;width:100%;max-width:100%;overflow-x:hidden;background:var(--bg);color:var(--text)}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans TC",sans-serif;-webkit-text-size-adjust:100%;touch-action:manipulation}
button,input{font:inherit;font-size:16px}
.app{width:100vw;max-width:100vw;min-height:100dvh;padding:calc(10px + env(safe-area-inset-top)) 10px calc(92px + env(safe-area-inset-bottom))}
.topbar{display:flex;justify-content:space-between;align-items:center;padding:4px 2px 12px}
.brand{font-size:20px;font-weight:900;letter-spacing:.5px}
.sub{font-size:12px;color:var(--muted);margin-top:2px}
.iconbtn,.btn{border:0;background:#fff;border-radius:13px;min-height:42px;padding:0 13px;font-weight:800;box-shadow:var(--shadow)}
.iconbtn{width:42px;padding:0;font-size:20px}
.calendar-card,.detail-card{width:100%;background:#fff;border-radius:20px;box-shadow:var(--shadow);overflow:hidden}
.cal-head{display:flex;justify-content:space-between;align-items:center;padding:14px}
.month-title{font-size:18px;font-weight:900}
.navs{display:flex;gap:7px}
.week{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));padding:0 7px 7px;text-align:center;color:var(--muted);font-size:11px}
.grid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));border-top:1px solid var(--line)}
.day{min-width:0;min-height:74px;padding:6px 4px;border-right:1px solid var(--line);border-bottom:1px solid var(--line);overflow:hidden;background:#fff}
.day:nth-child(7n){border-right:0}
.day.other{background:#fafbfc;color:#c4c7ce}
.day.selected{outline:2px solid #111827;outline-offset:-2px;background:#fbfbfd}
.num{font-size:11px;font-weight:800}
.today .num{display:inline-flex;align-items:center;justify-content:center;width:21px;height:21px;border-radius:7px;background:#111827;color:#fff}
.minipeople{display:flex;flex-wrap:wrap;gap:3px;margin-top:5px}
.person-mini{width:18px;height:18px;flex:0 0 18px;border-radius:6px;display:flex;align-items:center;justify-content:center;color:#fff;font-size:9px;font-weight:900;box-shadow:inset 0 0 0 1px rgba(255,255,255,.45),0 1px 3px rgba(0,0,0,.12)}
.more{font-size:9px;color:var(--muted);line-height:18px}
.detail-card{margin-top:10px;padding:14px;overflow:visible}
.detail-top{display:flex;justify-content:space-between;align-items:flex-start;gap:8px}
.detail-title{font-size:17px;font-weight:900}
.detail-date{font-size:11px;color:var(--muted);margin-top:3px}
.editbtn{background:#111827;color:#fff;box-shadow:none;white-space:nowrap}
.shift-block{margin-top:15px}
.shift-title{font-size:12px;font-weight:900;color:#6b7280;margin-bottom:8px}
.people-row{display:flex;flex-wrap:wrap;gap:8px}
.person-wrap{margin-bottom:18px}
.person-chip{width:44px;height:44px;border-radius:13px;display:flex;align-items:center;justify-content:center;color:#fff;font-size:17px;font-weight:900;position:relative}
.person-chip small{position:absolute;bottom:-17px;width:68px;text-align:center;color:#4b5563;font-size:10px;font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.empty{padding:18px 0 4px;color:var(--muted);font-size:13px}
.fab{position:fixed;z-index:10;left:10px;right:10px;bottom:calc(14px + env(safe-area-inset-bottom));height:54px;border:0;border-radius:17px;background:#111827;color:#fff;font-size:16px;font-weight:900;box-shadow:0 14px 30px rgba(17,24,39,.25)}

.sheetwrap{position:fixed;inset:0;background:rgba(17,24,39,.35);display:none;align-items:flex-end;z-index:20}
.sheetwrap.show{display:flex}
.sheet{width:100vw;max-width:100vw;max-height:94dvh;overflow-y:auto;overflow-x:hidden;background:#fff;border-radius:24px 24px 0 0;padding:10px 10px calc(18px + env(safe-area-inset-bottom))}
.handle{width:40px;height:5px;background:#d7d9df;border-radius:999px;margin:0 auto 10px}
.sheethead{display:flex;justify-content:space-between;align-items:center;gap:8px}
.sheettitle{font-size:18px;font-weight:900}
.close{width:36px;height:36px;border:0;border-radius:11px;background:#f1f3f5;font-size:18px}
.help{font-size:11px;color:var(--muted);margin:6px 0 11px}
.mode-row{display:flex;gap:7px;margin:10px 0}
.mode{flex:1;border:1px solid #e5e7eb;background:#fff;border-radius:12px;padding:10px;font-weight:900}
.mode.active{background:#111827;color:#fff;border-color:#111827}

.pool,.lane{border:1.5px dashed #d7dae2;border-radius:16px;padding:9px}
.pool{background:#fafbfc;min-height:76px}
#lanes{display:flex;gap:9px;overflow-x:auto;overflow-y:hidden;padding:2px 1px 8px;-webkit-overflow-scrolling:touch;scroll-snap-type:x proximity}
.lane{margin-top:9px;background:#fff;flex:0 0 42vw;min-width:42vw;max-width:180px;min-height:180px;scroll-snap-align:start}
.lane.over,.pool.over{border-color:#111827;background:#f7f7f8}
.lanehead{display:flex;align-items:center;justify-content:space-between;gap:5px;margin-bottom:8px}
.lanename{font-size:13px;font-weight:900;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dragpeople{display:flex;flex-wrap:wrap;gap:7px}
.lane .dragpeople{flex-direction:row;align-items:flex-start;align-content:flex-start;flex-wrap:wrap}
.dragperson{min-height:36px;padding:0 9px;border-radius:11px;color:#fff;display:flex;align-items:center;gap:6px;font-weight:900;touch-action:none;user-select:none;cursor:grab;box-shadow:0 4px 10px rgba(17,24,39,.1)}
.lane .dragperson{width:auto;max-width:100%;flex:0 0 auto}
.dragperson b{font-size:15px}
.dragperson span{font-size:11px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dragging{opacity:.5;transform:scale(.97)}

.settings{display:none;margin-top:11px;padding:11px;background:#f7f8fa;border-radius:15px}
.settings.show{display:block}
.settings-section+.settings-section{border-top:1px solid #e4e7ec;margin-top:15px;padding-top:15px}
.settings-title{font-size:14px;font-weight:900}
.settings-note{font-size:11px;color:var(--muted);margin-top:3px}
.fieldrow{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:7px;margin-top:8px}
input{width:100%;min-width:0;border:1px solid #e2e5ea;border-radius:11px;padding:10px 11px;background:#fff;outline:none}
.smallbtn{border:0;border-radius:11px;background:#eceef2;padding:0 11px;min-height:42px;font-weight:900;white-space:nowrap}
.person-form{display:grid;grid-template-columns:minmax(0,1fr) 70px 48px;gap:7px;margin-top:9px;align-items:center}
.person-form input[type=color]{padding:3px;height:42px}
.person-form .smallbtn{grid-column:1/-1}
.person-settings-list{display:flex;flex-direction:column;gap:7px;margin-top:10px}
.person-setting-item{display:flex;align-items:center;gap:8px;background:#fff;border:1px solid #e7e9ee;border-radius:12px;padding:7px 8px}
.person-setting-icon{width:30px;height:30px;border-radius:9px;display:flex;align-items:center;justify-content:center;color:#fff;font-weight:900;flex:none}
.person-setting-name{font-size:13px;font-weight:900;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.person-setting-short{font-size:11px;color:var(--muted);margin-left:auto;flex:none}
.danger{background:#fff0f0;color:#b42318}
.actions{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin-top:13px}
.primary{background:#111827;color:#fff;box-shadow:none}
.secondary{background:#eef0f3;box-shadow:none}
.clear-confirm{display:none;margin-top:9px;padding:10px;border:1px solid #ffd8d4;border-radius:12px;background:#fff3f2;font-size:12px}
.clear-confirm.show{display:block}
.clear-confirm-actions{display:flex;gap:7px;margin-top:8px}
.clear-confirm-actions button{flex:1}
.toast{position:fixed;z-index:30;left:50%;bottom:calc(78px + env(safe-area-inset-bottom));transform:translateX(-50%);display:none;background:#111827;color:#fff;border-radius:11px;padding:9px 13px;font-size:12px;white-space:nowrap}
@media(max-width:360px){
  .day{min-height:68px;padding:5px 3px}
  .person-mini{width:16px;height:16px;flex-basis:16px;font-size:8px;border-radius:5px}
  .lane{flex-basis:45vw;min-width:45vw}
}
</style>
</head>
<body>
<div class="app">
  <div class="topbar">
    <div><div class="brand">MASALU</div><div class="sub">排班月曆</div></div>
    <button class="iconbtn" id="todayBtn">今</button>
  </div>

  <section class="calendar-card">
    <div class="cal-head">
      <div class="month-title" id="monthTitle"></div>
      <div class="navs"><button class="iconbtn" id="prevBtn">‹</button><button class="iconbtn" id="nextBtn">›</button></div>
    </div>
    <div class="week"><div>日</div><div>一</div><div>二</div><div>三</div><div>四</div><div>五</div><div>六</div></div>
    <div class="grid" id="calendar"></div>
  </section>

  <section class="detail-card">
    <div class="detail-top">
      <div><div class="detail-title" id="detailTitle"></div><div class="detail-date" id="detailDate"></div></div>
      <button class="btn editbtn" id="editBtn">編輯排班</button>
    </div>
    <div id="detailBody"></div>
  </section>
</div>

<button class="fab" id="fab">＋ 新增 / 編輯排班</button>

<div class="sheetwrap" id="sheetwrap">
  <div class="sheet">
    <div class="handle"></div>
    <div class="sheethead">
      <div><div class="sheettitle" id="sheetTitle">編輯排班</div><div class="help">左右班別拖放；設定可新增班別與人員。</div></div>
      <button class="close" id="closeBtn">×</button>
    </div>

    <div class="mode-row">
      <button class="mode active" data-mode="schedule">排班</button>
      <button class="mode" data-mode="settings">設定</button>
    </div>

    <div class="settings" id="settingsBox">
      <div class="settings-section">
        <div class="settings-title">班別設定</div>
        <div class="settings-note">班別依此順序由左到右顯示。</div>
        <div id="shiftInputs"></div>
        <div class="fieldrow"><input id="newShiftName" placeholder="新增班別，例如：中班"><button class="smallbtn" id="addShiftBtn">新增</button></div>
      </div>

      <div class="settings-section">
        <div class="settings-title">人員設定</div>
        <div class="settings-note">所有畫面皆依此名單順序排序；新增人員會排在最後。</div>
        <div class="person-form">
          <input id="newStaffName" placeholder="姓名，例如：佳玲">
          <input id="newStaffShort" maxlength="1" placeholder="代表字">
          <input id="newStaffColor" type="color" value="#7C3AED">
          <button class="smallbtn" id="addStaffBtn">新增人員</button>
        </div>
        <div class="person-settings-list" id="staffSettingsList"></div>
      </div>
    </div>

    <div id="scheduleArea">
      <div class="shift-title">尚未安排</div>
      <div class="pool dropzone" id="unassigned" data-zone="unassigned"><div class="dragpeople"></div></div>
      <div id="lanes"></div>

      <div class="clear-confirm" id="clearConfirm">
        確定要清空這一天的全部排班嗎？
        <div class="clear-confirm-actions">
          <button class="smallbtn" id="cancelClear">取消</button>
          <button class="smallbtn danger" id="confirmClear">確定清空</button>
        </div>
      </div>

      <div class="actions">
        <button class="btn secondary" id="clearBtn">清空當天</button>
        <button class="btn primary" id="saveBtn">儲存排班</button>
      </div>
    </div>
  </div>
</div>
<div class="toast" id="toast"></div>

<script>
const defaults = [
  {id:'zhou',name:'周政',short:'政',color:'#3B82F6'},
  {id:'ying',name:'乙瑄',short:'乙',color:'#EC4899'},
  {id:'lin',name:'林淇',short:'淇',color:'#8B5CF6'},
  {id:'mi',name:'小米',short:'米',color:'#F97316'},
  {id:'yong',name:'勇翰',short:'翰',color:'#F59E0B'},
  {id:'wang',name:'王玲',short:'玲',color:'#14B8A6'},
  {id:'fang',name:'方芳',short:'芳',color:'#EF4444'},
  {id:'yuqi',name:'鈺琪',short:'鈺',color:'#06B6D4'},
  {id:'zhaoting',name:'妱婷',short:'婷',color:'#84CC16'},
  {id:'tingxian',name:'庭嫻',short:'庭',color:'#6366F1'}
];

const STORE='masalu_schedule_v7';
let saved={};
try{
  saved=JSON.parse(localStorage.getItem(STORE)||'{}');
}catch(e){}
let staff=Array.isArray(saved.staff)&&saved.staff.length?saved.staff:defaults.map(x=>({...x}));
let shifts=Array.isArray(saved.shifts)&&saved.shifts.length?saved.shifts:['早班','晚班','休假'];
let schedules=saved.schedules||{};

function persist(){localStorage.setItem(STORE,JSON.stringify({staff,shifts,schedules}))}
function staffIndex(id){return staff.findIndex(p=>p.id===id)}
function sortIds(ids){return [...new Set(ids)].filter(id=>staffIndex(id)>=0).sort((a,b)=>staffIndex(a)-staffIndex(b))}
function pById(id){return staff.find(p=>p.id===id)}
function pad(n){return String(n).padStart(2,'0')}
function keyOf(d){return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`}
function dateFromKey(k){const[a,b,c]=k.split('-').map(Number);return new Date(a,b-1,c)}
function isOff(name){return ['休假','休','off','休息'].includes(String(name).trim().toLowerCase())}
function toast(t){const el=document.getElementById('toast');el.textContent=t;el.style.display='block';setTimeout(()=>el.style.display='none',1300)}

const now=new Date();
let viewYear=now.getFullYear(),viewMonth=now.getMonth();
let selected=keyOf(now);
let draft=null;

function scheduledWorkIds(k){
  const sch=schedules[k]||{};
  let ids=[];
  Object.entries(sch).forEach(([shift,arr])=>{
    if(!isOff(shift)) ids.push(...arr);
  });
  return sortIds(ids);
}

function renderCalendar(){
  document.getElementById('monthTitle').textContent=`${viewYear} 年 ${viewMonth+1} 月`;
  const grid=document.getElementById('calendar');
  grid.innerHTML='';
  const first=new Date(viewYear,viewMonth,1);
  const start=new Date(viewYear,viewMonth,1-first.getDay());

  for(let i=0;i<42;i++){
    const d=new Date(start);
    d.setDate(start.getDate()+i);
    const k=keyOf(d);
    const ids=scheduledWorkIds(k);
    const cell=document.createElement('div');
    cell.className='day'+(d.getMonth()!==viewMonth?' other':'')+(k===selected?' selected':'')+(k===keyOf(now)?' today':'');
    const icons=ids.slice(0,6).map(id=>{
      const p=pById(id);
      return p?`<div class="person-mini" style="background:${p.color}" title="${p.name}">${p.short}</div>`:'';
    }).join('');
    cell.innerHTML=`<div class="num">${d.getDate()}</div><div class="minipeople">${icons}${ids.length>6?`<span class="more">+${ids.length-6}</span>`:''}</div>`;
    cell.onclick=()=>{selected=k;renderCalendar();renderDetail()};
    grid.appendChild(cell);
  }
}

function renderDetail(){
  const d=dateFromKey(selected);
  document.getElementById('detailTitle').textContent=`${d.getDate()} 日排班`;
  document.getElementById('detailDate').textContent=`${d.getFullYear()} 年 ${d.getMonth()+1} 月 ${d.getDate()} 日`;
  const body=document.getElementById('detailBody');
  const sch=schedules[selected]||{};
  const any=Object.values(sch).some(a=>Array.isArray(a)&&a.length);
  if(!any){body.innerHTML='<div class="empty">這一天尚未排班。</div>';return}
  body.innerHTML='';
  shifts.forEach(shift=>{
    const ids=sortIds(sch[shift]||[]);
    if(!ids.length)return;
    const block=document.createElement('div');
    block.className='shift-block';
    block.innerHTML=`<div class="shift-title">${shift}</div><div class="people-row">${
      ids.map(id=>{
        const p=pById(id); if(!p)return '';
        return `<div class="person-wrap"><div class="person-chip" style="background:${p.color}">${p.short}<small>${p.name}</small></div></div>`;
      }).join('')
    }</div>`;
    body.appendChild(block);
  });
}

function makeDraft(){
  const sch=schedules[selected]||{};
  const used=new Set();
  const x={unassigned:[]};
  shifts.forEach(s=>{
    x[s]=sortIds(sch[s]||[]);
    x[s].forEach(id=>used.add(id));
  });
  x.unassigned=sortIds(staff.map(p=>p.id).filter(id=>!used.has(id)));
  return x;
}

function openEditor(){
  draft=makeDraft();
  const d=dateFromKey(selected);
  document.getElementById('sheetTitle').textContent=`${d.getMonth()+1}/${d.getDate()} 編輯排班`;
  document.querySelectorAll('.mode').forEach((b,i)=>b.classList.toggle('active',i===0));
  document.getElementById('settingsBox').classList.remove('show');
  document.getElementById('scheduleArea').style.display='';
  document.getElementById('clearConfirm').classList.remove('show');
  renderEditor();
  document.getElementById('sheetwrap').classList.add('show');
}

function dragPerson(id){
  const p=pById(id);
  const el=document.createElement('div');
  el.className='dragperson';el.draggable=true;el.dataset.id=id;
  el.style.background=p.color;
  el.innerHTML=`<b>${p.short}</b><span>${p.name}</span>`;
  el.addEventListener('dragstart',e=>{el.classList.add('dragging');e.dataTransfer.setData('text/plain',id)});
  el.addEventListener('dragend',()=>el.classList.remove('dragging'));
  setupTouchDrag(el);
  return el;
}

function renderEditor(){
  Object.keys(draft).forEach(k=>draft[k]=sortIds(draft[k]||[]));

  const un=document.querySelector('#unassigned .dragpeople');
  un.innerHTML='';
  draft.unassigned.forEach(id=>un.appendChild(dragPerson(id)));
  setupDrop(document.getElementById('unassigned'));

  const lanes=document.getElementById('lanes');
  lanes.innerHTML='';
  shifts.forEach(shift=>{
    const lane=document.createElement('div');
    lane.className='lane dropzone';lane.dataset.zone=shift;
    lane.innerHTML=`<div class="lanehead"><div class="lanename">${shift}</div><div style="font-size:11px;color:#9aa0a6">${draft[shift].length} 人</div></div><div class="dragpeople"></div>`;
    draft[shift].forEach(id=>lane.querySelector('.dragpeople').appendChild(dragPerson(id)));
    setupDrop(lane);
    lanes.appendChild(lane);
  });
  renderSettings();
}

function movePerson(id,target){
  Object.keys(draft).forEach(k=>draft[k]=draft[k].filter(x=>x!==id));
  if(!draft[target])draft[target]=[];
  draft[target].push(id);
  draft[target]=sortIds(draft[target]);
  renderEditor();
}

function setupDrop(zone){
  zone.ondragover=e=>{e.preventDefault();zone.classList.add('over')};
  zone.ondragleave=()=>zone.classList.remove('over');
  zone.ondrop=e=>{e.preventDefault();zone.classList.remove('over');movePerson(e.dataTransfer.getData('text/plain'),zone.dataset.zone)};
}
let touchState=null;
function setupTouchDrag(el){
  el.addEventListener('pointerdown',e=>{
    if(e.pointerType==='mouse')return;
    touchState={el,id:el.dataset.id};
    try{el.setPointerCapture(e.pointerId)}catch(_){}
    el.classList.add('dragging');
  });
  el.addEventListener('pointermove',e=>{
    if(!touchState||touchState.el!==el)return;
    document.querySelectorAll('.dropzone').forEach(z=>z.classList.remove('over'));
    const t=document.elementFromPoint(e.clientX,e.clientY);
    const z=t&&t.closest('.dropzone');
    if(z)z.classList.add('over');
  });
  el.addEventListener('pointerup',e=>{
    if(!touchState||touchState.el!==el)return;
    const t=document.elementFromPoint(e.clientX,e.clientY);
    const z=t&&t.closest('.dropzone');
    document.querySelectorAll('.dropzone').forEach(x=>x.classList.remove('over'));
    el.classList.remove('dragging');
    if(z)movePerson(el.dataset.id,z.dataset.zone);
    touchState=null;
  });
}

function renderSettings(){
  const si=document.getElementById('shiftInputs');
  si.innerHTML='';
  shifts.forEach((s,i)=>{
    const row=document.createElement('div');
    row.className='fieldrow';
    row.innerHTML=`<input value="${s}"><button class="smallbtn danger">刪除</button>`;
    row.querySelector('input').onchange=e=>{
      const n=e.target.value.trim();
      if(!n||n===s||shifts.includes(n)){e.target.value=s;return}
      shifts[i]=n;
      if(draft[s]){draft[n]=draft[s];delete draft[s]}
      Object.values(schedules).forEach(day=>{if(day[s]){day[n]=day[s];delete day[s]}})
      persist();renderEditor();renderCalendar();renderDetail();
    };
    row.querySelector('button').onclick=()=>{
      if(shifts.length<=1)return toast('至少保留一個班別');
      const ids=draft[s]||[];
      draft.unassigned=sortIds([...draft.unassigned,...ids]);
      delete draft[s];
      shifts.splice(i,1);
      Object.values(schedules).forEach(day=>delete day[s]);
      persist();renderEditor();renderCalendar();renderDetail();
    };
    si.appendChild(row);
  });

  const list=document.getElementById('staffSettingsList');
  list.innerHTML='';
  staff.forEach((p,i)=>{
    const row=document.createElement('div');
    row.className='person-setting-item';
    row.innerHTML=`<div class="person-setting-icon" style="background:${p.color}">${p.short}</div><div class="person-setting-name">${i+1}. ${p.name}</div><div class="person-setting-short">${p.short}</div><button class="smallbtn danger" style="min-height:34px;padding:0 9px;font-size:12px">刪除</button>`;
    row.querySelector('button').onclick=()=>{
      staff=staff.filter(x=>x.id!==p.id);
      Object.values(schedules).forEach(day=>Object.keys(day).forEach(s=>day[s]=day[s].filter(id=>id!==p.id)));
      Object.keys(draft).forEach(k=>draft[k]=draft[k].filter(id=>id!==p.id));
      persist();renderEditor();renderCalendar();renderDetail();
    };
    list.appendChild(row);
  });
}

document.getElementById('addShiftBtn').onclick=()=>{
  const input=document.getElementById('newShiftName');
  const n=input.value.trim();
  if(!n)return toast('請輸入班別名稱');
  if(shifts.includes(n))return toast('班別已存在');
  shifts.push(n);draft[n]=[];input.value='';persist();renderEditor();
};

document.getElementById('addStaffBtn').onclick=()=>{
  const name=document.getElementById('newStaffName').value.trim();
  const short=document.getElementById('newStaffShort').value.trim() || (name?name[0]:'');
  const color=document.getElementById('newStaffColor').value;
  if(!name)return toast('請輸入姓名');
  const id='p_'+Date.now().toString(36);
  staff.push({id,name,short:short.slice(0,1),color});
  draft.unassigned=sortIds([...draft.unassigned,id]);
  document.getElementById('newStaffName').value='';
  document.getElementById('newStaffShort').value='';
  persist();renderEditor();renderCalendar();toast('已新增人員');
};

document.querySelectorAll('.mode').forEach(btn=>{
  btn.onclick=()=>{
    document.querySelectorAll('.mode').forEach(x=>x.classList.remove('active'));
    btn.classList.add('active');
    const settings=btn.dataset.mode==='settings';
    document.getElementById('settingsBox').classList.toggle('show',settings);
    document.getElementById('scheduleArea').style.display=settings?'none':'';
    if(settings)renderSettings();
  };
});

document.getElementById('saveBtn').onclick=()=>{
  const out={};
  shifts.forEach(s=>out[s]=sortIds(draft[s]||[]));
  schedules[selected]=out;
  persist();renderCalendar();renderDetail();
  document.getElementById('sheetwrap').classList.remove('show');
  toast('排班已儲存');
};

document.getElementById('clearBtn').onclick=()=>document.getElementById('clearConfirm').classList.add('show');
document.getElementById('cancelClear').onclick=()=>document.getElementById('clearConfirm').classList.remove('show');
document.getElementById('confirmClear').onclick=()=>{
  delete schedules[selected];
  persist();
  draft=makeDraft();
  document.getElementById('clearConfirm').classList.remove('show');
  renderEditor();renderCalendar();renderDetail();
  toast('當天排班已清空');
};

document.getElementById('editBtn').onclick=openEditor;
document.getElementById('fab').onclick=openEditor;
document.getElementById('closeBtn').onclick=()=>document.getElementById('sheetwrap').classList.remove('show');
document.getElementById('sheetwrap').onclick=e=>{if(e.target.id==='sheetwrap')e.currentTarget.classList.remove('show')};
document.getElementById('prevBtn').onclick=()=>{viewMonth--;if(viewMonth<0){viewMonth=11;viewYear--}renderCalendar()};
document.getElementById('nextBtn').onclick=()=>{viewMonth++;if(viewMonth>11){viewMonth=0;viewYear++}renderCalendar()};
document.getElementById('todayBtn').onclick=()=>{viewYear=now.getFullYear();viewMonth=now.getMonth();selected=keyOf(now);renderCalendar();renderDetail()};

renderCalendar();renderDetail();
</script>
</body>
</html>
