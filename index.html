<!doctype html>
<html lang="zh-Hant"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,minimum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>MASALU 排班月曆</title>
<style>
:root{
  --bg:#f6f7fb;--card:#fff;--text:#202124;--muted:#8a8f98;--line:#e8eaf0;
  --shadow:0 10px 26px rgba(17,24,39,.08)
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;width:100%;max-width:100%;overflow-x:hidden;background:var(--bg);color:var(--text)}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans TC",sans-serif;-webkit-text-size-adjust:100%;touch-action:manipulation}
button,input{font:inherit;font-size:16px}
button:disabled{opacity:.45}
.app{width:100vw;max-width:100vw;min-height:100dvh;padding:calc(10px + env(safe-area-inset-top)) 10px calc(92px + env(safe-area-inset-bottom))}
.topbar{display:flex;justify-content:space-between;align-items:center;padding:4px 2px 12px;gap:8px}
.brand{font-size:20px;font-weight:900;letter-spacing:.5px}
.sub{font-size:12px;color:var(--muted);margin-top:2px}
.top-actions{display:flex;gap:7px}
.iconbtn,.btn{border:0;background:#fff;border-radius:13px;min-height:42px;padding:0 13px;font-weight:800;box-shadow:var(--shadow)}
.iconbtn{width:42px;padding:0;font-size:18px}
.calendar-card,.detail-card{width:100%;background:#fff;border-radius:20px;box-shadow:var(--shadow);overflow:hidden}
.cal-head{display:flex;justify-content:space-between;align-items:center;padding:14px}
.month-title{font-size:18px;font-weight:900}
.navs{display:flex;gap:7px}
.week{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));padding:0 7px 7px;text-align:center;color:var(--muted);font-size:11px}
.grid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));border-top:1px solid var(--line)}
.day{min-width:0;min-height:128px;padding:6px 4px;border-right:1px solid var(--line);border-bottom:1px solid var(--line);overflow:hidden;background:#fff}
.day:nth-child(7n){border-right:0}
.day.other{background:#fafbfc;color:#c4c7ce}
.day.selected{outline:2px solid #111827;outline-offset:-2px;background:#fbfbfd}
.num{font-size:11px;font-weight:800}
.today .num{display:inline-flex;align-items:center;justify-content:center;width:21px;height:21px;border-radius:7px;background:#111827;color:#fff}
.minipeople{
  display:flex;
  flex-direction:column;
  align-items:stretch;
  gap:3px;
  margin-top:5px
}
.shift-mini-group{
  display:flex;
  flex-wrap:wrap;
  align-items:flex-start;
  gap:3px;
  padding:3px;
  border:1px solid rgba(17,24,39,.10);
  border-radius:7px;
  background:rgba(148,163,184,.09)
}
.shift-mini-group-label{
  width:100%;
  font-size:7px;
  line-height:1;
  color:#7b818b;
  font-weight:800;
  margin-bottom:1px;
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis
}
.person-mini{width:17px;height:17px;flex:0 0 17px;border-radius:6px;display:flex;align-items:center;justify-content:center;color:#fff;font-size:9px;font-weight:900;box-shadow:inset 0 0 0 1px rgba(255,255,255,.45),0 1px 3px rgba(0,0,0,.12)}
.more{display:none}
.detail-card{margin-top:10px;padding:14px;overflow:visible}
.detail-top{display:flex;justify-content:space-between;align-items:flex-start;gap:8px}
.detail-title{font-size:17px;font-weight:900}
.detail-date{font-size:11px;color:var(--muted);margin-top:3px}
.editbtn{background:#111827;color:#fff;box-shadow:none;white-space:nowrap}
.shift-block{
  margin-top:12px;
  padding:10px;
  border:1px solid rgba(17,24,39,.08);
  border-radius:14px;
  background:rgba(148,163,184,.08)
}
.shift-title{font-size:12px;font-weight:900;color:#4b5563;margin-bottom:8px}
.people-row{display:flex;flex-wrap:wrap;gap:8px}
.person-wrap{margin-bottom:18px}
.person-chip{width:44px;height:44px;border-radius:13px;display:flex;align-items:center;justify-content:center;color:#fff;font-size:17px;font-weight:900;position:relative}
.person-chip small{position:absolute;bottom:-17px;width:68px;text-align:center;color:#4b5563;font-size:10px;font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.empty{padding:18px 0 4px;color:var(--muted);font-size:13px}
.fab{position:fixed;z-index:10;left:10px;right:10px;bottom:calc(14px + env(safe-area-inset-bottom));height:54px;border:0;border-radius:17px;background:#111827;color:#fff;font-size:16px;font-weight:900;box-shadow:0 14px 30px rgba(17,24,39,.25)}
.status{font-size:11px;color:var(--muted);padding:10px 2px 0;text-align:center}

.sheetwrap{position:fixed;inset:0;background:rgba(17,24,39,.35);display:none;z-index:20}
.sheetwrap{align-items:flex-end}
.sheetwrap.show{display:flex}
.sheet{width:100vw;max-width:100vw;max-height:94dvh;overflow-y:auto;overflow-x:hidden;background:#fff;border-radius:24px 24px 0 0;padding:10px 10px calc(18px + env(safe-area-inset-bottom))}
.handle{width:40px;height:5px;background:#d7d9df;border-radius:999px;margin:0 auto 10px}
.sheethead{display:flex;justify-content:space-between;align-items:center;gap:8px}
.sheettitle{font-size:18px;font-weight:900}
.close{width:36px;height:36px;border:0;border-radius:11px;background:#f1f3f5;font-size:18px}
.help{font-size:11px;color:var(--muted);margin:6px 0 11px}
.mode-row{display:flex;gap:7px;margin:10px 0}
.mode{flex:1;border:1px solid #e5e7eb;background:#fff;border-radius:12px;padding:10px;font-weight:900}
.mode.active{background:#111827;color:#fff;border-color:#111827}
.pool,.lane{border:1.5px dashed #d7dae2;border-radius:16px;padding:9px}
.pool{background:#fafbfc;min-height:76px}
#lanes{display:flex;gap:9px;overflow-x:auto;overflow-y:hidden;padding:2px 1px 8px;-webkit-overflow-scrolling:touch;scroll-snap-type:x proximity}
.lane{margin-top:9px;background:#fff;flex:0 0 42vw;min-width:42vw;max-width:180px;min-height:180px;scroll-snap-align:start}
.lane.over,.pool.over{border-color:#111827;background:#f7f7f8}
.lanehead{display:flex;align-items:center;justify-content:space-between;gap:5px;margin-bottom:8px}
.lanename{font-size:13px;font-weight:900;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dragpeople{display:flex;flex-wrap:wrap;gap:7px}
.lane .dragpeople{flex-direction:row;align-items:flex-start;align-content:flex-start;flex-wrap:wrap}
.dragperson{min-height:36px;width:auto;max-width:100%;flex:0 0 auto;padding:0 9px;border-radius:11px;color:#fff;display:flex;align-items:center;gap:6px;font-weight:900;touch-action:none;user-select:none;cursor:grab;box-shadow:0 4px 10px rgba(17,24,39,.1)}
.dragperson b{font-size:15px}
.dragperson span{font-size:11px;white-space:nowrap}
.dragging{opacity:.5;transform:scale(.97)}

.settings{display:none;margin-top:11px;padding:11px;background:#f7f8fa;border-radius:15px}
.settings.show{display:block}
.settings-section+.settings-section{border-top:1px solid #e4e7ec;margin-top:15px;padding-top:15px}
.settings-title{font-size:14px;font-weight:900}
.settings-note{font-size:11px;color:var(--muted);margin-top:3px}
.fieldrow{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:7px;margin-top:8px}
input{width:100%;min-width:0;border:1px solid #e2e5ea;border-radius:11px;padding:10px 11px;background:#fff;outline:none}
.smallbtn{border:0;border-radius:11px;background:#eceef2;padding:0 11px;min-height:42px;font-weight:900;white-space:nowrap}
.person-form{display:grid;grid-template-columns:minmax(0,1fr) 70px 48px;gap:7px;margin-top:9px;align-items:center}
.person-form input[type=color]{padding:3px;height:42px}
.person-form .smallbtn{grid-column:1/-1}
.person-settings-list{display:flex;flex-direction:column;gap:7px;margin-top:10px}
.person-setting-item{display:grid;grid-template-columns:34px minmax(0,1fr) 56px 52px;align-items:center;gap:7px;background:#fff;border:1px solid #e7e9ee;border-radius:12px;padding:7px 8px}
.person-setting-icon{width:30px;height:30px;border-radius:9px;display:flex;align-items:center;justify-content:center;color:#fff;font-weight:900}
.person-setting-name{font-size:13px;font-weight:900;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.person-setting-short{font-size:11px;color:var(--muted)}
.danger{background:#fff0f0;color:#b42318}
.actions{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin-top:13px}
.primary{background:#111827;color:#fff;box-shadow:none}
.secondary{background:#eef0f3;box-shadow:none}
.clear-confirm{display:none;margin-top:9px;padding:10px;border:1px solid #ffd8d4;border-radius:12px;background:#fff3f2;font-size:12px}
.clear-confirm.show{display:block}
.clear-confirm-actions{display:flex;gap:7px;margin-top:8px}
.clear-confirm-actions button{flex:1}

.modalwrap{align-items:center;justify-content:center;padding:18px}
.modal{width:100%;max-width:430px;background:#fff;border-radius:20px;padding:16px;box-shadow:var(--shadow)}
.modal-title{font-size:18px;font-weight:900}
.modal-text{font-size:12px;color:var(--muted);line-height:1.6;margin:6px 0 12px}
.modal-actions{display:flex;gap:8px;margin-top:10px}
.modal-actions button{flex:1}
.toast{position:fixed;z-index:40;left:50%;bottom:calc(78px + env(safe-area-inset-bottom));transform:translateX(-50%);display:none;background:#111827;color:#fff;border-radius:11px;padding:9px 13px;font-size:12px;white-space:nowrap}
.loading{position:fixed;inset:0;z-index:50;background:rgba(246,247,251,.82);display:none;align-items:center;justify-content:center;font-weight:900}
.loading.show{display:flex}
@media(max-width:360px){
  .day{min-height:116px;padding:5px 3px}
  .person-mini{width:16px;height:16px;flex-basis:16px;font-size:8px;border-radius:5px}
  .lane{flex-basis:45vw;min-width:45vw}
}
</style></head>
<body>
<div class="app">
  <div class="topbar">
    <div>
      <div class="brand" id="appName">MASALU</div>
      <div class="sub">排班月曆</div>
    </div>
    <div class="top-actions">
      <button class="iconbtn" id="reloadBtn" title="重新整理">↻</button>
      <button class="iconbtn" id="todayBtn">今</button>
    </div>
  </div>

  <section class="calendar-card">
    <div class="cal-head">
      <div class="month-title" id="monthTitle"></div>
      <div class="navs">
        <button class="iconbtn" id="prevBtn">‹</button>
        <button class="iconbtn" id="nextBtn">›</button>
      </div>
    </div>
    <div class="week"><div>日</div><div>一</div><div>二</div><div>三</div><div>四</div><div>五</div><div>六</div></div>
    <div class="grid" id="calendar"></div>
  </section>

  <section class="detail-card">
    <div class="detail-top">
      <div>
        <div class="detail-title" id="detailTitle">排班</div>
        <div class="detail-date" id="detailDate"></div>
      </div>
      <button class="btn editbtn" id="editBtn">編輯排班</button>
    </div>
    <div id="detailBody"><div class="empty">載入中…</div></div>
  </section>

  <div class="status" id="statusText"></div>
</div>

<button class="fab" id="fab">＋ 新增 / 編輯排班</button>

<div class="sheetwrap" id="sheetwrap">
  <div class="sheet">
    <div class="handle"></div>
    <div class="sheethead">
      <div>
        <div class="sheettitle" id="sheetTitle">編輯排班</div>
        <div class="help">拖曳人員到左右班別；設定可新增／修改班別與人員。</div>
      </div>
      <button class="close" id="closeBtn">×</button>
    </div>

    <div class="mode-row">
      <button class="mode active" data-mode="schedule">排班</button>
      <button class="mode" data-mode="settings">設定</button>
    </div>

    <div class="settings" id="settingsBox">
      <div class="settings-section">
        <div class="settings-title">班別設定</div>
        <div class="settings-note">資料全部存在 GAS / Google Sheet，前端沒有寫死班別。</div>
        <div id="shiftInputs"></div>
        <div class="fieldrow">
          <input id="newShiftName" placeholder="新增班別，例如：中班">
          <button class="smallbtn" id="addShiftBtn">新增</button>
        </div>
      </div>

      <div class="settings-section">
        <div class="settings-title">人員設定</div>
        <div class="settings-note">所有畫面依 GAS 的 sort_order 排序，新人會自動排最後。</div>
        <div class="person-form">
          <input id="newStaffName" placeholder="姓名">
          <input id="newStaffShort" maxlength="1" placeholder="代表字">
          <input id="newStaffColor" type="color" value="#7C3AED">
          <button class="smallbtn" id="addStaffBtn">新增人員</button>
        </div>
        <div class="person-settings-list" id="staffSettingsList"></div>
      </div>
    </div>

    <div id="scheduleArea">
      <div class="shift-title">尚未安排</div>
      <div class="pool dropzone" id="unassigned" data-zone="unassigned">
        <div class="dragpeople"></div>
      </div>
      <div id="lanes"></div>

      <div class="clear-confirm" id="clearConfirm">
        確定清空這一天的全部排班？
        <div class="clear-confirm-actions">
          <button class="smallbtn" id="cancelClear">取消</button>
          <button class="smallbtn danger" id="confirmClear">確定清空</button>
        </div>
      </div>

      <div class="actions">
        <button class="btn secondary" id="clearBtn">清空當天</button>
        <button class="btn primary" id="saveBtn">儲存排班</button>
      </div>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>
<div class="loading show" id="loading">儲存中…</div>

<script>
/**
 * HTML 不含 staff / shifts / schedules。
 * GAS Web App URL 固定於前端；人員、班別、排班全部由 GAS / Google Sheet 載入。
 * 目前依需求暫不啟用管理密碼。
 */
const GAS_URL = 'https://script.google.com/macros/s/AKfycbxhRiznkXzHyXwB04NSYKEwBBNFS3iJctHvqK-QUzNnRR1pPV8SXu-RMXI8ykCljtfI/exec';

const state = {
  staff: [],
  shifts: [],
  schedules: [],
  settings: {},
  draft: null
};

const now = new Date();
let viewYear = now.getFullYear();
let viewMonth = now.getMonth();
let selected = keyOf(now);
let touchState = null;

const $ = s => document.querySelector(s);
const $$ = s => [...document.querySelectorAll(s)];

function pad(n){ return String(n).padStart(2,'0'); }
function keyOf(d){ return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`; }
function dateFromKey(k){ const [y,m,d]=k.split('-').map(Number); return new Date(y,m-1,d); }
function staffIndex(id){ return state.staff.findIndex(p => p.id === id); }
function sortIds(ids){
  return [...new Set(ids)]
    .filter(id => staffIndex(id) >= 0)
    .sort((a,b) => staffIndex(a) - staffIndex(b));
}
function pById(id){ return state.staff.find(p => p.id === id); }
function shiftById(id){ return state.shifts.find(s => s.id === id); }
function isWorkShift(id){
  const s = shiftById(id);
  return !!s && !s.isOff;
}
function setLoading(v){ $('#loading').classList.toggle('show', !!v); }
function toast(text){
  const el=$('#toast');
  el.textContent=text;
  el.style.display='block';
  clearTimeout(el._timer);
  el._timer=setTimeout(()=>el.style.display='none',1500);
}
function escapeHtml(s){
  return String(s ?? '')
    .replaceAll('&','&amp;')
    .replaceAll('<','&lt;')
    .replaceAll('>','&gt;')
    .replaceAll('"','&quot;')
    .replaceAll("'","&#039;");
}

function getGasUrl(){ return GAS_URL; }

/**
 * JSONP API：
 * 可直接從 GitHub Pages 呼叫 GAS，不依賴 fetch CORS。
 */
function gasCall(action, payload = {}, timeoutMs = 15000){
  const gasUrl = getGasUrl();
  if(!gasUrl) return Promise.reject(new Error('尚未設定 GAS API 網址'));

  return new Promise((resolve,reject)=>{
    const cb='__masalu_cb_'+Date.now()+'_'+Math.random().toString(36).slice(2,8);
    const script=document.createElement('script');
    let finished=false;

    const cleanup=()=>{
      try{ delete window[cb]; }catch(_){ window[cb]=undefined; }
      script.remove();
    };

    const timer=setTimeout(()=>{
      if(finished)return;
      finished=true;
      cleanup();
      reject(new Error('GAS 連線逾時'));
    },timeoutMs);

    window[cb]=(res)=>{
      if(finished)return;
      finished=true;
      clearTimeout(timer);
      cleanup();
      if(res && res.ok) resolve(res);
      else reject(new Error(res && res.error ? res.error : 'GAS 回傳錯誤'));
    };

    script.onerror=()=>{
      if(finished)return;
      finished=true;
      clearTimeout(timer);
      cleanup();
      reject(new Error('無法載入 GAS API，請確認部署網址與公開權限'));
    };

    const qs=new URLSearchParams({
      action,
      callback: cb,
      payload: JSON.stringify(payload),
      _: String(Date.now())
    });

    script.src=gasUrl+'?'+qs.toString();
    document.head.appendChild(script);
  });
}

async function loadBootstrap(showLoading=true){
  if(showLoading)setLoading(true);

  try{
    const res=await gasCall('bootstrap');
    state.staff=Array.isArray(res.staff)?res.staff:[];
    state.shifts=Array.isArray(res.shifts)?res.shifts:[];
    state.schedules=Array.isArray(res.schedules)?res.schedules:[];
    state.settings=res.settings||{};

    $('#appName').textContent=state.settings.app_name || 'MASALU';
    $('#statusText').textContent=`已同步 · DB ${res.databaseId || ''} · ${res.serverTime || ''}`;

    renderCalendar();
    renderDetail();

  }catch(err){
    $('#statusText').textContent='連線失敗';
    $('#detailBody').innerHTML=`<div class="empty">${escapeHtml(err.message)}</div>`;
    toast(err.message);
  }finally{
    if(showLoading)setLoading(false);
  }
}


function replaceDaySchedules(date, newRows){
  state.schedules = state.schedules.filter(r => r.date !== date);
  if(Array.isArray(newRows) && newRows.length){
    state.schedules.push(...newRows);
  }
}

function rowsForDate(date){
  return state.schedules.filter(r => r.date === date);
}


function workGroupsForDate(date){
  const rows=rowsForDate(date);
  return state.shifts
    .filter(shift=>!shift.isOff)
    .map(shift=>({
      shift,
      ids:sortIds(rows.filter(r=>r.shiftId===shift.id).map(r=>r.staffId))
    }))
    .filter(group=>group.ids.length);
}

function scheduledWorkIds(date){
  const ids=rowsForDate(date)
    .filter(r => isWorkShift(r.shiftId))
    .map(r => r.staffId);
  return sortIds(ids);
}

function renderCalendar(){
  $('#monthTitle').textContent=`${viewYear} 年 ${viewMonth+1} 月`;
  const grid=$('#calendar');
  grid.innerHTML='';

  const first=new Date(viewYear,viewMonth,1);
  const start=new Date(viewYear,viewMonth,1-first.getDay());

  for(let i=0;i<42;i++){
    const d=new Date(start);
    d.setDate(start.getDate()+i);
    const k=keyOf(d);
    const groups=workGroupsForDate(k);

    const cell=document.createElement('div');
    cell.className='day'
      +(d.getMonth()!==viewMonth?' other':'')
      +(k===selected?' selected':'')
      +(k===keyOf(now)?' today':'');

    const groupHtml=groups.map(group=>{
      const icons=group.ids.map(id=>{
        const p=pById(id);
        return p
          ? `<div class="person-mini" style="background:${escapeHtml(p.color)}" title="${escapeHtml(p.name)}">${escapeHtml(p.short)}</div>`
          : '';
      }).join('');

      return `<div class="shift-mini-group" title="${escapeHtml(group.shift.name)}">`+
        `<div class="shift-mini-group-label">${escapeHtml(group.shift.name)}</div>`+
        icons+
      `</div>`;
    }).join('');

    cell.innerHTML=
      `<div class="num">${d.getDate()}</div>`+
      `<div class="minipeople">${groupHtml}</div>`;
    cell.onclick=()=>{
      selected=k;
      renderCalendar();
      renderDetail();
    };

    grid.appendChild(cell);
  }
}

function renderDetail(){
  const d=dateFromKey(selected);
  $('#detailTitle').textContent=`${d.getDate()} 日排班`;
  $('#detailDate').textContent=`${d.getFullYear()} 年 ${d.getMonth()+1} 月 ${d.getDate()} 日`;

  const body=$('#detailBody');
  const rows=rowsForDate(selected);

  if(!rows.length){
    body.innerHTML='<div class="empty">這一天尚未排班。</div>';
    return;
  }

  body.innerHTML='';

  state.shifts.forEach(shift=>{
    const ids=sortIds(
      rows.filter(r=>r.shiftId===shift.id).map(r=>r.staffId)
    );
    if(!ids.length)return;

    const block=document.createElement('div');
    block.className='shift-block';
    block.innerHTML=
      `<div class="shift-title">${escapeHtml(shift.name)}</div>`+
      `<div class="people-row">${
        ids.map(id=>{
          const p=pById(id);
          if(!p)return '';
          return `<div class="person-wrap"><div class="person-chip" style="background:${escapeHtml(p.color)}">${escapeHtml(p.short)}<small>${escapeHtml(p.name)}</small></div></div>`;
        }).join('')
      }</div>`;

    body.appendChild(block);
  });
}

function makeDraft(){
  const rows=rowsForDate(selected);
  const draft={unassigned:[]};
  const used=new Set();

  state.shifts.forEach(s=>{
    draft[s.id]=sortIds(
      rows.filter(r=>r.shiftId===s.id).map(r=>r.staffId)
    );
    draft[s.id].forEach(id=>used.add(id));
  });

  draft.unassigned=sortIds(
    state.staff.map(p=>p.id).filter(id=>!used.has(id))
  );

  return draft;
}

function openEditor(){
  state.draft=makeDraft();
  const d=dateFromKey(selected);
  $('#sheetTitle').textContent=`${d.getMonth()+1}/${d.getDate()} 編輯排班`;
  $$('.mode').forEach((b,i)=>b.classList.toggle('active',i===0));
  $('#settingsBox').classList.remove('show');
  $('#scheduleArea').style.display='';
  $('#clearConfirm').classList.remove('show');
  renderEditor();
  $('#sheetwrap').classList.add('show');
}

function dragPerson(id){
  const p=pById(id);
  if(!p)return document.createElement('span');

  const el=document.createElement('div');
  el.className='dragperson';
  el.draggable=true;
  el.dataset.id=id;
  el.style.background=p.color;
  el.innerHTML=`<b>${escapeHtml(p.short)}</b><span>${escapeHtml(p.name)}</span>`;

  el.addEventListener('dragstart',e=>{
    el.classList.add('dragging');
    e.dataTransfer.setData('text/plain',id);
  });
  el.addEventListener('dragend',()=>el.classList.remove('dragging'));

  setupTouchDrag(el);
  return el;
}

function renderEditor(){
  if(!state.draft)return;

  Object.keys(state.draft).forEach(k=>{
    state.draft[k]=sortIds(state.draft[k]||[]);
  });

  const un=$('#unassigned .dragpeople');
  un.innerHTML='';
  state.draft.unassigned.forEach(id=>un.appendChild(dragPerson(id)));
  setupDrop($('#unassigned'));

  const lanes=$('#lanes');
  lanes.innerHTML='';

  state.shifts.forEach(shift=>{
    const lane=document.createElement('div');
    lane.className='lane dropzone';
    lane.dataset.zone=shift.id;
    lane.innerHTML=
      `<div class="lanehead">`+
        `<div class="lanename">${escapeHtml(shift.name)}</div>`+
        `<div style="font-size:11px;color:#9aa0a6">${(state.draft[shift.id]||[]).length} 人</div>`+
      `</div>`+
      `<div class="dragpeople"></div>`;

    (state.draft[shift.id]||[]).forEach(id=>{
      lane.querySelector('.dragpeople').appendChild(dragPerson(id));
    });

    setupDrop(lane);
    lanes.appendChild(lane);
  });

  renderSettings();
}

function movePerson(id,target){
  if(!state.draft)return;

  Object.keys(state.draft).forEach(k=>{
    state.draft[k]=(state.draft[k]||[]).filter(x=>x!==id);
  });

  if(!state.draft[target])state.draft[target]=[];
  state.draft[target].push(id);
  state.draft[target]=sortIds(state.draft[target]);
  renderEditor();
}

function setupDrop(zone){
  zone.ondragover=e=>{e.preventDefault();zone.classList.add('over');};
  zone.ondragleave=()=>zone.classList.remove('over');
  zone.ondrop=e=>{
    e.preventDefault();
    zone.classList.remove('over');
    movePerson(e.dataTransfer.getData('text/plain'),zone.dataset.zone);
  };
}

function setupTouchDrag(el){
  el.addEventListener('pointerdown',e=>{
    if(e.pointerType==='mouse')return;
    touchState={el,id:el.dataset.id};
    try{el.setPointerCapture(e.pointerId);}catch(_){}
    el.classList.add('dragging');
  });

  el.addEventListener('pointermove',e=>{
    if(!touchState || touchState.el!==el)return;
    $$('.dropzone').forEach(z=>z.classList.remove('over'));
    const t=document.elementFromPoint(e.clientX,e.clientY);
    const z=t&&t.closest('.dropzone');
    if(z)z.classList.add('over');
  });

  el.addEventListener('pointerup',e=>{
    if(!touchState || touchState.el!==el)return;
    const t=document.elementFromPoint(e.clientX,e.clientY);
    const z=t&&t.closest('.dropzone');
    $$('.dropzone').forEach(x=>x.classList.remove('over'));
    el.classList.remove('dragging');
    if(z)movePerson(el.dataset.id,z.dataset.zone);
    touchState=null;
  });
}

function renderSettings(){
  const shiftWrap=$('#shiftInputs');
  shiftWrap.innerHTML='';

  state.shifts.forEach(shift=>{
    const row=document.createElement('div');
    row.className='fieldrow';
    row.innerHTML=
      `<input value="${escapeHtml(shift.name)}">`+
      `<button class="smallbtn danger">刪除</button>`;

    const input=row.querySelector('input');
    input.onchange=async()=>{
      const name=input.value.trim();
      if(!name || name===shift.name){
        input.value=shift.name;
        return;
      }
      await runMutation('updateShift',{id:shift.id,name});
    };

    row.querySelector('button').onclick=async()=>{
      await runMutation('deleteShift',{id:shift.id});
    };

    shiftWrap.appendChild(row);
  });

  const list=$('#staffSettingsList');
  list.innerHTML='';

  state.staff.forEach((p,i)=>{
    const row=document.createElement('div');
    row.className='person-setting-item';
    row.innerHTML=
      `<div class="person-setting-icon" style="background:${escapeHtml(p.color)}">${escapeHtml(p.short)}</div>`+
      `<div class="person-setting-name">${i+1}. ${escapeHtml(p.name)}</div>`+
      `<div class="person-setting-short">${escapeHtml(p.short)}</div>`+
      `<button class="smallbtn danger" style="min-height:34px;padding:0 8px;font-size:12px">刪除</button>`;

    row.querySelector('button').onclick=async()=>{
      await runMutation('deleteStaff',{id:p.id});
    };

    list.appendChild(row);
  });
}

async function runMutation(action,payload){
  setLoading(true);
  try{
    await gasCall(action,{...payload});
    await loadBootstrap(false);

    if($('#sheetwrap').classList.contains('show')){
      state.draft=makeDraft();
      renderEditor();
    }
    toast('已同步');
    return true;
  }catch(err){
    toast(err.message);
    return false;
  }finally{
    setLoading(false);
  }
}

$('#addShiftBtn').onclick=async()=>{
  const input=$('#newShiftName');
  const name=input.value.trim();
  if(!name)return toast('請輸入班別名稱');

  setLoading(true);
  try{
    await gasCall('addShift',{
      name,
      isOff:false
    });
    input.value='';
    await loadBootstrap(false);
    state.draft=makeDraft();
    renderEditor();
    toast('已新增班別');
  }catch(err){
    toast(err.message);
  }finally{
    setLoading(false);
  }
};

$('#addStaffBtn').onclick=async()=>{
  const name=$('#newStaffName').value.trim();
  const shortName=$('#newStaffShort').value.trim() || (name ? name[0] : '');
  const color=$('#newStaffColor').value;

  if(!name)return toast('請輸入姓名');
  if(!shortName)return toast('請輸入代表字');

  setLoading(true);
  try{
    await gasCall('addStaff',{
      name,
      short:shortName.slice(0,1),
      color
    });

    $('#newStaffName').value='';
    $('#newStaffShort').value='';

    await loadBootstrap(false);
    state.draft=makeDraft();
    renderEditor();
    toast('已新增人員');
  }catch(err){
    toast(err.message);
  }finally{
    setLoading(false);
  }
};

$$('.mode').forEach(btn=>{
  btn.onclick=()=>{
    $$('.mode').forEach(x=>x.classList.remove('active'));
    btn.classList.add('active');

    const settings=btn.dataset.mode==='settings';
    $('#settingsBox').classList.toggle('show',settings);
    $('#scheduleArea').style.display=settings?'none':'';

    if(settings)renderSettings();
  };
});

$('#saveBtn').onclick=async()=>{
  const assignments={};
  state.shifts.forEach(s=>{
    assignments[s.id]=sortIds(state.draft[s.id]||[]);
  });

  setLoading(true);
  try{
    const res=await gasCall('saveDay',{
      date:selected,
      assignments
    });

    replaceDaySchedules(selected,res.schedules||[]);
    renderCalendar();
    renderDetail();
    $('#sheetwrap').classList.remove('show');
    toast('已儲存');
  }catch(err){
    toast(err.message);
  }finally{
    setLoading(false);
  }
};

$('#clearBtn').onclick=()=>$('#clearConfirm').classList.add('show');
$('#cancelClear').onclick=()=>$('#clearConfirm').classList.remove('show');

$('#confirmClear').onclick=async()=>{
  setLoading(true);
  try{
    const res=await gasCall('clearDay',{
      date:selected
    });

    replaceDaySchedules(selected,res.schedules||[]);
    state.draft=makeDraft();
    $('#clearConfirm').classList.remove('show');
    renderEditor();
    renderCalendar();
    renderDetail();
    toast('當天排班已清空');
  }catch(err){
    toast(err.message);
  }finally{
    setLoading(false);
  }
};

$('#editBtn').onclick=openEditor;
$('#fab').onclick=openEditor;

$('#closeBtn').onclick=()=>$('#sheetwrap').classList.remove('show');
$('#sheetwrap').onclick=e=>{
  if(e.target.id==='sheetwrap')e.currentTarget.classList.remove('show');
};

$('#prevBtn').onclick=()=>{
  viewMonth--;
  if(viewMonth<0){viewMonth=11;viewYear--;}
  renderCalendar();
};

$('#nextBtn').onclick=()=>{
  viewMonth++;
  if(viewMonth>11){viewMonth=0;viewYear++;}
  renderCalendar();
};

$('#todayBtn').onclick=()=>{
  viewYear=now.getFullYear();
  viewMonth=now.getMonth();
  selected=keyOf(now);
  renderCalendar();
  renderDetail();
};

$('#reloadBtn').onclick=()=>loadBootstrap(true);

(function boot(){ loadBootstrap(true); })();
</script>


</body></html>
